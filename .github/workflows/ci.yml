name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download and verify Godot Standard
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .godot-version)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          engine_dir="$RUNNER_TEMP/iron-and-harvest-godot"
          mkdir -p "$engine_dir"
          cd "$engine_dir"
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/${version}-stable/$archive" \
            --output "$archive"
          sha256sum --check "$GITHUB_WORKSPACE/tools/ci/godot-linux.sha256"
          unzip -q "$archive"
          engine_bin="$engine_dir/Godot_v${version}-stable_linux.x86_64"
          chmod +x "$engine_bin"
          echo "GODOT_BIN=$engine_bin" >> "$GITHUB_ENV"
      - name: Run repository and headless engine checks
        run: python3 tools/run_ci.py
      - name: Preserve check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/
          if-no-files-found: warn
          retention-days: 7
